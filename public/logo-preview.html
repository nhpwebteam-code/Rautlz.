<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Raultz Brand Logo Vector Inspection</title>
  <style>
    body {
      background: #0D0D0D;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1100px;
    }
    .card {
      padding: 30px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .dark { background: #161616; color: #FFF; }
    .light { background: #FAF7F2; color: #161616; border-color: rgba(0,0,0,0.1); }
    .pure-black { background: #000; color: #FFF; }
    .wordmark {
      font-family: "Inter", "Plus Jakarta Sans", sans-serif;
      font-weight: 800;
      letter-spacing: -0.04em;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <h1>Raultz Monogram Vector Variants</h1>
  
  <div class="grid">
    <!-- Dark Card with Monogram -->
    <div class="card dark">
      <h3>Dark Background (Navbar / Footer / Dark Mode)</h3>
      <svg width="180" height="120" viewBox="0 0 160 110" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF5A36" />
            <stop offset="100%" stop-color="#E53517" />
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF4D2E" flood-opacity="0.35"/>
          </filter>
        </defs>
        <g transform="skewX(-16) translate(22, 6)">
          <!-- R Frame in White -->
          <!-- Left Arm / Backbone with Architectural Notch -->
          <path 
            d="M 14 18 H 28 L 22 50 H 8 L 0 92 H 14 L 20 62 H 30 L 37 18 Z" 
            fill="#FFFFFF" 
            opacity="0.95"
          />
          <!-- R Upper Aerodynamic Loop -->
          <path 
            d="M 30 18 H 74 C 92 18 104 27 104 43 C 104 57 93 67 75 67 H 58 L 64 55 H 74 C 82 55 88 50 88 43 C 88 36 82 30 72 30 H 42 Z" 
            fill="#FFFFFF" 
            opacity="0.95"
          />
          <!-- R Right Leg -->
          <path 
            d="M 64 56 H 79 L 102 92 H 87 Z" 
            fill="#FFFFFF" 
            opacity="0.95"
          />
          <!-- Z Centerpiece in Vivid Red with Subtle Glow -->
          <path 
            d="M 34 26 H 76 L 69 38 H 52 L 32 73 H 74 L 67 86 H 20 L 27 74 L 46 38 H 28 Z" 
            fill="url(#redGrad)"
            filter="url(#glow)"
          />
        </g>
      </svg>
      <div class="wordmark">RAULTZ</div>
    </div>

    <!-- Light Card with Monogram -->
    <div class="card light">
      <h3>Light Background (Standard Canvas)</h3>
      <svg width="180" height="120" viewBox="0 0 160 110" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="skewX(-16) translate(22, 6)">
          <!-- R Frame in Deep Carbon -->
          <path 
            d="M 14 18 H 28 L 22 50 H 8 L 0 92 H 14 L 20 62 H 30 L 37 18 Z" 
            fill="#161616" 
          />
          <path 
            d="M 30 18 H 74 C 92 18 104 27 104 43 C 104 57 93 67 75 67 H 58 L 64 55 H 74 C 82 55 88 50 88 43 C 88 36 82 30 72 30 H 42 Z" 
            fill="#161616" 
          />
          <path 
            d="M 64 56 H 79 L 102 92 H 87 Z" 
            fill="#161616" 
          />
          <!-- Z Centerpiece in Vibrant Terracotta/Red -->
          <path 
            d="M 34 26 H 76 L 69 38 H 52 L 32 73 H 74 L 67 86 H 20 L 27 74 L 46 38 H 28 Z" 
            fill="#FF4D2E" 
          />
        </g>
      </svg>
      <div class="wordmark" style="color: #161616;">RAULTZ</div>
    </div>

    <!-- Pure Black Monogram for Intro -->
    <div class="card pure-black">
      <h3>Pitch Black Stage (Intro / Hero)</h3>
      <svg width="180" height="120" viewBox="0 0 160 110" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="skewX(-16) translate(22, 6)">
          <path 
            d="M 14 18 H 28 L 22 50 H 8 L 0 92 H 14 L 20 62 H 30 L 37 18 Z" 
            fill="#FFFFFF" 
          />
          <path 
            d="M 30 18 H 74 C 92 18 104 27 104 43 C 104 57 93 67 75 67 H 58 L 64 55 H 74 C 82 55 88 50 88 43 C 88 36 82 30 72 30 H 42 Z" 
            fill="#FFFFFF" 
          />
          <path 
            d="M 64 56 H 79 L 102 92 H 87 Z" 
            fill="#FFFFFF" 
          />
          <path 
            d="M 34 26 H 76 L 69 38 H 52 L 32 73 H 74 L 67 86 H 20 L 27 74 L 46 38 H 28 Z" 
            fill="#FF4D2E" 
          />
        </g>
      </svg>
      <div class="wordmark" style="color: #FFF;">RAULTZ<span style="color:#FF4D2E">.</span></div>
    </div>
  </div>
</body>
</html>
